# Argos completo com um comando:  docker compose up --build
#   Console:  http://localhost:3030     API: http://localhost:8081
# A aplicacao de demonstracao (microsservicos) sobe separada: veja demo/README.md.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: argos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d argos"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/argos
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${ARGOS_UI_PORT:-3030}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Cria a organizacao, o usuario administrador e a chave de API da demonstracao (idempotente)
  # e grava a chave em demo/generated/argos.env para o coletor da aplicacao de demo.
  seed:
    image: alpine:3.20
    command: ["sh", "/seed.sh"]
    environment:
      ARGOS_URL: http://backend:8081
    volumes:
      - ./demo/seed.sh:/seed.sh:ro
      - ./demo/generated:/out
    depends_on:
      - backend
    restart: "no"

volumes:
  postgres-data:
