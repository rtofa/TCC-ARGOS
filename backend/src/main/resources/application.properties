spring.application.name=argos-api
server.port=8081

# Local overrides (e.g. ARGOS_DB_PORT when 5434 is taken on your machine) go in backend/.env, which is not committed.
# IDEs start the app from different folders (backend/, the repo root or the folder above it), so the local .env
# is looked up in each of them.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:TCC-ARGOS/backend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${ARGOS_DB_PORT:5435}/argos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Requests run on virtual threads (Java 21): blocking on models and on the search cluster costs no platform thread.
spring.threads.virtual.enabled=true
# Async responses (support agent answers, streaming included) may take longer than the container default.
spring.mvc.async.request-timeout=130s

# ---------------------------------------------------------------------------------------------------------------
# AI model layer (LangChain4j). Nothing is fixed in code: every value comes from environment variables, which can
# live in backend/.env (gitignored). A route without model or key is skipped.
#
# Chat models: a primary and up to three fallbacks, each from any provider.
#   provider "openai" = any OpenAI-compatible API (OpenAI, Groq, Gemini, OpenRouter, Mistral, DeepSeek, Ollama...)
#   provider "anthropic" = Claude
# On timeout, 5xx, overload or rate limit the call is retried with backoff and then moves to the next route.
# REASONING_EFFORT (low/medium/high) is only sent when set, since not every model accepts it.
argos.ai.routes[0].name=principal
argos.ai.routes[0].provider=${ARGOS_LLM_PRIMARY_PROVIDER:openai}
argos.ai.routes[0].base-url=${ARGOS_LLM_PRIMARY_BASE_URL:}
argos.ai.routes[0].model=${ARGOS_LLM_PRIMARY_MODEL:}
argos.ai.routes[0].api-key=${ARGOS_LLM_PRIMARY_API_KEY:}
argos.ai.routes[0].reasoning-effort=${ARGOS_LLM_PRIMARY_REASONING_EFFORT:}
argos.ai.routes[1].name=fallback-1
argos.ai.routes[1].provider=${ARGOS_LLM_FALLBACK1_PROVIDER:openai}
argos.ai.routes[1].base-url=${ARGOS_LLM_FALLBACK1_BASE_URL:}
argos.ai.routes[1].model=${ARGOS_LLM_FALLBACK1_MODEL:}
argos.ai.routes[1].api-key=${ARGOS_LLM_FALLBACK1_API_KEY:}
argos.ai.routes[1].reasoning-effort=${ARGOS_LLM_FALLBACK1_REASONING_EFFORT:}
argos.ai.routes[2].name=fallback-2
argos.ai.routes[2].provider=${ARGOS_LLM_FALLBACK2_PROVIDER:openai}
argos.ai.routes[2].base-url=${ARGOS_LLM_FALLBACK2_BASE_URL:}
argos.ai.routes[2].model=${ARGOS_LLM_FALLBACK2_MODEL:}
argos.ai.routes[2].api-key=${ARGOS_LLM_FALLBACK2_API_KEY:}
argos.ai.routes[2].reasoning-effort=${ARGOS_LLM_FALLBACK2_REASONING_EFFORT:}
argos.ai.routes[3].name=fallback-3
argos.ai.routes[3].provider=${ARGOS_LLM_FALLBACK3_PROVIDER:openai}
argos.ai.routes[3].base-url=${ARGOS_LLM_FALLBACK3_BASE_URL:}
argos.ai.routes[3].model=${ARGOS_LLM_FALLBACK3_MODEL:}
argos.ai.routes[3].api-key=${ARGOS_LLM_FALLBACK3_API_KEY:}
argos.ai.routes[3].reasoning-effort=${ARGOS_LLM_FALLBACK3_REASONING_EFFORT:}
argos.ai.request-timeout=${ARGOS_LLM_TIMEOUT:45s}
argos.ai.retry.max-attempts=${ARGOS_LLM_RETRY_ATTEMPTS:2}

# Embeddings (semantic side of the hybrid search): OpenAI text-embedding-3-small. Without a key the agent searches
# with PostgreSQL full-text alone.
argos.ai.embedding.base-url=${ARGOS_EMBEDDING_BASE_URL:https://api.openai.com/v1}
argos.ai.embedding.api-key=${OPENAI_API_KEY:}
argos.ai.embedding.model=${ARGOS_EMBEDDING_MODEL:text-embedding-3-small}
argos.ai.embedding.dimensions=${ARGOS_EMBEDDING_DIMENSIONS:1536}

# Reranking: Cohere Rerank. Without a key the fused ranking is used as is.
argos.ai.rerank.api-key=${COHERE_API_KEY:}
argos.ai.rerank.model=${ARGOS_RERANK_MODEL:rerank-v3.5}

# ---------------------------------------------------------------------------------------------------------------
# Support agent (RAG over the official documentation). Knowledge base on this same PostgreSQL: hybrid search with
# pgvector + full-text (Portuguese dictionary), fused with RRF by LangChain4j. Needs the pgvector extension
# (image pgvector/pgvector:pg15-trixie); without it the agent falls back to full-text search.
# Markdown documents: classpath:knowledge-base/ (shipped) or file:/path/to/docs/ (maintained outside the build).
argos.helpdesk.knowledge-base.location=${ARGOS_HELPDESK_KB_LOCATION:classpath:knowledge-base/}
# Structured JSON logs (traceId, stage, durations...): set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash).

# Notificações ao abrir incidentes (MON-08 / INT-05): Slack, Discord e E-mail (SMTP opcional).
argos.notifications.console-base-url=${ARGOS_CONSOLE_URL:http://localhost:3030}
argos.notifications.mail-from=${ARGOS_MAIL_FROM:noreply@argos.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
