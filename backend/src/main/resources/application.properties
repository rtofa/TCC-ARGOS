spring.application.name=argos-api
server.port=8081

# Local overrides (e.g. ARGOS_DB_PORT when 5434 is taken on your machine) go in backend/.env, which is not committed.
# IDEs start the app from different folders (backend/, the repo root or the folder above it), so the local .env
# is looked up in each of them.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:TCC-ARGOS/backend/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${ARGOS_DB_PORT:5435}/argos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# AI investigator (AI-01, AI-02, AI-05), on free models. Keys go in backend/.env (gitignored):
#   GROQ_API_KEY   -> https://console.groq.com/keys        (routes 1, 3 and 4)
#   GEMINI_API_KEY -> https://aistudio.google.com/apikey   (route 2, optional)
# Routes without a key are skipped; with no key at all the investigator runs in heuristic mode.
# Each model has its own free quota, so a 429 on one moves the agent to the next (LLM routing).
argos.ai.routes[0].name=primario
argos.ai.routes[0].base-url=https://api.groq.com/openai/v1
argos.ai.routes[0].api-key=${GROQ_API_KEY:}
argos.ai.routes[0].model=openai/gpt-oss-120b
argos.ai.routes[1].name=reserva
argos.ai.routes[1].base-url=https://generativelanguage.googleapis.com/v1beta/openai/
argos.ai.routes[1].api-key=${GEMINI_API_KEY:}
argos.ai.routes[1].model=gemini-flash-lite-latest
argos.ai.routes[2].name=contingencia
argos.ai.routes[2].base-url=https://api.groq.com/openai/v1
argos.ai.routes[2].api-key=${GROQ_API_KEY:}
argos.ai.routes[2].model=qwen/qwen3.8-27b
# Qwen on Groq only accepts reasoning_effort "none"/"default".
argos.ai.routes[2].reasoning-effort=default
argos.ai.routes[3].name=ultimo-modelo
argos.ai.routes[3].base-url=https://api.groq.com/openai/v1
argos.ai.routes[3].api-key=${GROQ_API_KEY:}
argos.ai.routes[3].model=openai/gpt-oss-20b
